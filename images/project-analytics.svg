<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="OmniMetrics Dashboard Preview">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#p3Grad)"/>
  <!-- Top bar -->
  <rect x="25" y="20" width="350" height="28" rx="6" fill="#3f3f46"/>
  <text x="40" y="38" fill="#fafafa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Live Metrics</text>
  <circle cx="345" cy="34" r="5" fill="#22c55e"/>
  <text x="330" y="38" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Live Stream</text>

  <!-- Metric boxes -->
  <rect x="25" y="60" width="105" height="55" rx="6" fill="#3f3f46"/>
  <text x="35" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Active Sessions</text>
  <text x="35" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">14,290</text>

  <rect x="145" y="60" width="110" height="55" rx="6" fill="#3f3f46"/>
  <text x="155" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Avg Response</text>
  <text x="155" y="104" fill="#4ade80" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">42 ms</text>

  <rect x="270" y="60" width="105" height="55" rx="6" fill="#3f3f46"/>
  <text x="280" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">A11y Score</text>
  <text x="280" y="104" fill="#facc15" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">100 / 100</text>

  <!-- Chart representation -->
  <rect x="25" y="130" width="350" height="85" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <polyline points="40,195 90,165 140,180 190,150 240,160 290,140 350,145" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="290" cy="140" r="4" fill="#38bdf8"/>
  <circle cx="350" cy="145" r="4" fill="#38bdf8"/>
</svg>
