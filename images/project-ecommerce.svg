  <text x="77" y="170" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">$29.99</text>
  <rect x="35" y="180" width="85" height="20" rx="4" fill="#4f46e5"/>
  <text x="77" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Add to Cart</text>

  <rect x="145" y="65" width="105" height="145" rx="8" fill="#4338ca"/>
