  <rect x="265" y="65" width="110" height="145" rx="8" fill="#3730a3"/>
  <text x="320" y="105" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Screen Reader</text>
  <text x="320" y="125" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Optimized</text>
  <text x="320" y="150" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Semantic Lists</text>
  <text x="320" y="168" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Form Labels</text>
