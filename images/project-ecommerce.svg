  <text x="197" y="152" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bamboo Cup</text>
  <text x="197" y="170" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">$14.50</text>
  <rect x="155" y="180" width="85" height="20" rx="4" fill="#4f46e5"/>
