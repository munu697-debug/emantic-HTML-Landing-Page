      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#p2Grad)"/>
  <!-- Nav header -->
  <rect x="25" y="20" width="350" height="30" rx="6" fill="#3730a3"/>
