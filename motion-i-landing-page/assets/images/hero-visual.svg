<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Abstract digital interface visualization with glowing nodes, code architecture, and 3D wireframe mesh">
  <defs>
    <linearGradient id="heroBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="640" height="460" rx="16" fill="#0A0A0A" stroke="#1F2937" stroke-width="1"/>
  
  <!-- Ambient Radial Glow -->
  <circle cx="320" cy="230" r="220" fill="url(#meshGlow)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="40" x2="600" y2="40"/>
    <line x1="40" y1="120" x2="600" y2="120"/>
    <line x1="40" y1="200" x2="600" y2="200"/>
    <line x1="40" y1="280" x2="600" y2="280"/>
    <line x1="40" y1="360" x2="600" y2="360"/>
    <line x1="40" y1="420" x2="600" y2="420"/>

    <line x1="80" y1="40" x2="80" y2="420"/>
    <line x1="180" y1="40" x2="180" y2="420"/>
    <line x1="280" y1="40" x2="280" y2="420"/>
    <line x1="380" y1="40" x2="380" y2="420"/>
    <line x1="480" y1="40" x2="480" y2="420"/>
    <line x1="580" y1="40" x2="580" y2="420"/>
  </g>

  <!-- Central Floating Architectural Interface -->
  <g transform="translate(70, 60)" filter="url(#glowEffect)">
    <!-- Main Window Frame -->
    <rect width="500" height="310" rx="12" fill="#0D0D0D" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Top Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 488 0 Q 500 0 500 12 L 500 40 L 0 40 Z" fill="#141414"/>
    <circle cx="24" cy="20" r="4.5" fill="#EF4444"/>
    <circle cx="40" cy="20" r="4.5" fill="#F59E0B"/>
    <circle cx="56" cy="20" r="4.5" fill="#10B981"/>
    
    <!-- URL search box -->
    <rect x="110" y="10" width="280" height="20" rx="5" fill="#1F2937" stroke="#374151" stroke-width="0.8"/>
    <text x="250" y="24" fill="#9CA3AF" font-family="system-ui, monospace" font-size="9" text-anchor="middle">motion-i.com/enterprise-core</text>

    <!-- Code & Geometry Display -->
    <rect x="25" y="60" width="220" height="110" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="40" y="85" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">const elevate = async () =&gt; {</text>
    <text x="55" y="105" fill="#9CA3AF" font-family="monospace" font-size="11">await scaleArchitecture();</text>
    <text x="55" y="125" fill="#38BDF8" font-family="monospace" font-size="11">renderIconicExperience();</text>
    <text x="40" y="145" fill="#60A5FA" font-family="monospace" font-size="11">};</text>

    <!-- Metrics Card -->
    <rect x="265" y="60" width="210" height="110" rx="8" fill="#111827" stroke="#1E3A8A" stroke-width="1"/>
    <text x="285" y="85" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-transform="uppercase" letter-spacing="1">Performance Index</text>
    <text x="285" y="122" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="900">99.8%</text>
    <text x="390" y="120" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#9650; Ultra Fast</text>

    <!-- Bottom Wave / Data Graph -->
    <rect x="25" y="190" width="450" height="95" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <path d="M 40 260 C 100 210 160 270 230 220 C 300 170 370 250 450 200" fill="none" stroke="url(#neonLine)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glowing Nodes on Path -->
    <circle cx="40" cy="260" r="4" fill="#60A5FA"/>
    <circle cx="160" cy="270" r="4" fill="#3B82F6"/>
    <circle cx="230" cy="220" r="5" fill="#93C5FD"/>
    <circle cx="370" cy="250" r="4" fill="#3B82F6"/>
    <circle cx="450" cy="200" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
</svg>
