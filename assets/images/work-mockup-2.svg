<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Mockup of PulseAI Intelligent SaaS analytics interface built by MOTION I">
  <defs>
    <linearGradient id="wm2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="12" fill="url(#wm2Grad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="480" height="36" rx="12" fill="#0B132B"/>
  <circle cx="20" cy="18" r="4" fill="#EF4444"/>
  <circle cx="34" cy="18" r="4" fill="#F59E0B"/>
  <circle cx="48" cy="18" r="4" fill="#10B981"/>
  <rect x="120" y="8" width="240" height="20" rx="4" fill="#1E293B"/>
  <text x="240" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">app.pulseai.io/dashboard</text>

  <!-- Side navigation -->
  <rect x="15" y="48" width="80" height="235" rx="6" fill="#1E293B"/>
  <circle cx="35" cy="70" r="10" fill="#2563EB"/>
  <text x="52" y="74" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pulse</text>

  <!-- Metric widgets -->
  <rect x="110" y="48" width="105" height="60" rx="6" fill="#1E293B"/>
  <text x="120" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Active Nodes</text>
  <text x="120" y="94" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">18,420</text>

  <rect x="230" y="48" width="110" height="60" rx="6" fill="#1E293B"/>
  <text x="240" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Throughput</text>
  <text x="240" y="94" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="16" font-weight="800">4.2 GB/s</text>

  <rect x="355" y="48" width="110" height="60" rx="6" fill="#1E293B"/>
  <text x="365" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Uptime SLA</text>
  <text x="365" y="94" fill="#10B981" font-family="system-ui, sans-serif" font-size="16" font-weight="800">99.99%</text>

  <!-- Central Chart -->
  <rect x="110" y="125" width="355" height="158" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <polyline points="130,240 180,210 230,225 280,180 330,195 380,150 430,165" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <circle cx="380" cy="150" r="5" fill="#60A5FA"/>
  <text x="380" y="140" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+148% Scale</text>
</svg>
